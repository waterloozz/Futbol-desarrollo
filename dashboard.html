<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · Acta Digital Arbitral</title>

  <!-- Primer script y sin defer: protege la ruta antes de dibujar (ver js/sesion.js) -->
  <script src="js/sesion.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>

  <!-- Los defer se ejecutan en orden: nuestros scripts van antes que Alpine -->
  <script src="js/api.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-800">

  <header id="menu-comun"></header>

  <main x-data="dashboard" class="mx-auto w-full max-w-5xl flex-1 space-y-6 px-4 py-6">
    <section aria-labelledby="titulo-bienvenida">
      <h1 id="titulo-bienvenida" class="text-2xl font-semibold"
          x-text="resumen?.nombre ? `Bienvenido, ${resumen.nombre}` : 'Bienvenido'"></h1>
      <p class="text-slate-600">Este es el resumen del torneo.</p>
    </section>

    <!-- Cargando: skeleton con la misma forma que el contenido, para que nada salte al llegar los datos -->
    <div x-show="estado === 'cargando'" class="space-y-6" role="status" aria-live="polite">
      <span class="sr-only">Cargando el resumen…</span>
      <div class="grid grid-cols-2 gap-4 lg:grid-cols-4" aria-hidden="true">
        <template x-for="n in 4" :key="n">
          <div class="animate-pulse rounded-lg bg-white p-4 shadow-sm">
            <div class="h-4 w-2/3 rounded bg-slate-200"></div>
            <div class="mt-3 h-8 w-1/3 rounded bg-slate-200"></div>
          </div>
        </template>
      </div>
      <div class="grid gap-6 lg:grid-cols-2" aria-hidden="true">
        <template x-for="panel in 2" :key="panel">
          <div class="animate-pulse rounded-lg bg-white p-4 shadow-sm">
            <div class="mb-4 h-5 w-1/2 rounded bg-slate-200"></div>
            <template x-for="fila in 3" :key="fila">
              <div class="space-y-2 py-2">
                <div class="h-4 w-3/4 rounded bg-slate-200"></div>
                <div class="h-3 w-1/2 rounded bg-slate-100"></div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Error: mensaje y botón para volver a intentarlo -->
    <div x-show="estado === 'error'" x-cloak role="alert"
         class="flex flex-col gap-3 rounded-lg border border-red-200 bg-red-50 p-4 text-red-800 sm:flex-row sm:items-center sm:justify-between">
      <p x-text="mensajeError"></p>
      <button type="button" @click="cargar()"
              class="shrink-0 rounded-md bg-red-700 px-4 py-2 font-medium text-white hover:bg-red-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700">
        Reintentar
      </button>
    </div>

    <template x-if="estado === 'listo'">
      <div class="space-y-6">
        <section aria-labelledby="titulo-totales">
          <h2 id="titulo-totales" class="sr-only">Totales</h2>
          <dl class="grid grid-cols-2 gap-4 lg:grid-cols-4">
            <template x-for="i in indicadores" :key="i.id">
              <div class="rounded-lg bg-white p-4 shadow-sm">
                <dt class="text-sm text-slate-500" x-text="i.etiqueta"></dt>
                <dd class="text-3xl font-bold" x-text="i.valor"></dd>
              </div>
            </template>
          </dl>
        </section>

        <div class="grid gap-6 lg:grid-cols-2">
          <section aria-labelledby="titulo-proximos" class="rounded-lg bg-white p-4 shadow-sm">
            <h2 id="titulo-proximos" class="mb-3 text-lg font-semibold">Próximos partidos</h2>
            <p x-show="resumen.proximos.length === 0" class="text-slate-500">No hay partidos programados.</p>
            <ul class="divide-y divide-slate-100">
              <template x-for="p in resumen.proximos" :key="p.id">
                <li class="py-2">
                  <p class="font-medium"><span x-text="p.local"></span> vs <span x-text="p.visitante"></span></p>
                  <p class="text-sm text-slate-500">
                    <time :datetime="`${p.fecha}T${p.hora}`" x-text="`${formatearFecha(p.fecha)} · ${p.hora}`"></time>
                    · <span x-text="p.cancha"></span>
                  </p>
                </li>
              </template>
            </ul>
          </section>

          <section aria-labelledby="titulo-resultados" class="rounded-lg bg-white p-4 shadow-sm">
            <h2 id="titulo-resultados" class="mb-3 text-lg font-semibold">Últimos resultados</h2>
            <p x-show="resumen.ultimosResultados.length === 0" class="text-slate-500">Todavía no hay partidos finalizados.</p>
            <ul class="divide-y divide-slate-100">
              <template x-for="p in resumen.ultimosResultados" :key="p.id">
                <li class="flex items-center justify-between gap-3 py-2">
                  <span>
                    <span x-text="p.local"></span>
                    <strong class="mx-1" x-text="`${p.golesLocal} - ${p.golesVisitante}`"></strong>
                    <span x-text="p.visitante"></span>
                  </span>
                  <time class="shrink-0 text-sm text-slate-500" :datetime="p.fecha" x-text="formatearFecha(p.fecha)"></time>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </div>
    </template>
  </main>

  <footer x-data class="bg-slate-800 py-4 text-center text-sm text-slate-300">
    <p>Sistema de Acta Digital Arbitral · <span x-text="new Date().getFullYear()"></span></p>
  </footer>

</body>
</html>

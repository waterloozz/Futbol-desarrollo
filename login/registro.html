<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Sistema de Acta Digital Arbitral</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header>
    <h1>Sistema de Acta Digital Arbitral</h1>
  </header>

  <main>
    <section id="registro">
      <h2>Crear cuenta de árbitro</h2>
      <!-- [IA] inicio · ia/2026-11-09_waterloozz_registro-cuenta.md -->
      <form x-data="registro" @submit.prevent="registrar()" novalidate>
        <p x-show="errorGeneral" x-cloak role="alert" class="alerta-error" x-text="errorGeneral"></p>
        <div>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" autocomplete="name" placeholder="Juan Pérez"
            x-model="form.nombre" @blur="validarCampo('nombre')" @input="revalidar('nombre')"
            :class="errores.nombre ? 'input-error' : ''"
            :aria-invalid="errores.nombre ? 'true' : 'false'" aria-describedby="nombre-error">
          <small id="nombre-error" class="error-campo" x-show="errores.nombre" x-text="errores.nombre"></small>
        </div>
        <div>
          <label for="rut">RUT</label>
          <input type="text" id="rut" autocomplete="off" placeholder="12.345.678-5"
            x-model="form.rut" @blur="validarCampo('rut')" @input="revalidar('rut')"
            :class="errores.rut ? 'input-error' : ''"
            :aria-invalid="errores.rut ? 'true' : 'false'" aria-describedby="rut-error">
          <small id="rut-error" class="error-campo" x-show="errores.rut" x-text="errores.rut"></small>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="tu@correo.cl"
            x-model="form.email" @blur="validarCampo('email')" @input="revalidar('email')"
            :class="errores.email ? 'input-error' : ''"
            :aria-invalid="errores.email ? 'true' : 'false'" aria-describedby="email-error">
          <small id="email-error" class="error-campo" x-show="errores.email" x-text="errores.email"></small>
        </div>
        <div>
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" autocomplete="tel" placeholder="+56 9 1234 5678"
            x-model="form.telefono" @blur="validarCampo('telefono')" @input="revalidar('telefono')"
            :class="errores.telefono ? 'input-error' : ''"
            :aria-invalid="errores.telefono ? 'true' : 'false'" aria-describedby="telefono-error">
          <small id="telefono-error" class="error-campo" x-show="errores.telefono" x-text="errores.telefono"></small>
        </div>
        <div>
          <label for="categoria">Categoría</label>
          <select id="categoria"
            x-model="form.categoria" @change="validarCampo('categoria')" @blur="validarCampo('categoria')"
            :class="errores.categoria ? 'input-error' : ''"
            :aria-invalid="errores.categoria ? 'true' : 'false'" aria-describedby="categoria-error">
            <option value="">Selecciona una categoría</option>
            <template x-for="c in categorias" :key="c">
              <option :value="c" x-text="c"></option>
            </template>
          </select>
          <small id="categoria-error" class="error-campo" x-show="errores.categoria" x-text="errores.categoria"></small>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"
            x-model="form.password" @blur="validarCampo('password')" @input="revalidar('password')"
            :class="errores.password ? 'input-error' : ''"
            :aria-invalid="errores.password ? 'true' : 'false'" aria-describedby="password-error">
          <small id="password-error" class="error-campo" x-show="errores.password" x-text="errores.password"></small>
        </div>
        <div>
          <label for="confirmarPassword">Confirmar contraseña</label>
          <input type="password" id="confirmarPassword" autocomplete="new-password" placeholder="Repite la contraseña"
            x-model="form.confirmarPassword" @blur="validarCampo('confirmarPassword')" @input="revalidar('confirmarPassword')"
            :class="errores.confirmarPassword ? 'input-error' : ''"
            :aria-invalid="errores.confirmarPassword ? 'true' : 'false'" aria-describedby="confirmarPassword-error">
          <small id="confirmarPassword-error" class="error-campo" x-show="errores.confirmarPassword" x-text="errores.confirmarPassword"></small>
        </div>
        <div>
          <button type="submit" :disabled="enviando" x-text="enviando ? 'Creando cuenta…' : 'Crear cuenta'">Crear cuenta</button>
        </div>
        <p class="enlace-secundario">¿Ya tienes cuenta? <a href="../index.html">Inicia sesión</a></p>
      </form>
      <!-- [IA] fin -->
    </section>
  </main>

  <script src="../comun/api.js" defer></script>
  <script src="../comun/seguridad.js" defer></script>
  <script src="registro.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</body>
</html>

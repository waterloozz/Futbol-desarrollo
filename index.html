<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Acta Digital Arbitral</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="login/login.css">
</head>
<body>

  <header>
    <h1>Sistema de Acta Digital Arbitral</h1>
  </header>

  <main>
    <section id="login">
      <h2>Acceso al Sistema</h2>
      <form id="formLogin">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="tu@correo.cl">
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Tu contraseña">
        </div>
        <div>
          <button type="submit">Entrar</button>
        </div>
        <p id="mensaje"></p>
      </form>
    </section>
  </main>

  <script src="comun/api.js"></script>
  <script src="comun/seguridad.js"></script>
  <script src="login/login.js"></script>
</body>
</html>

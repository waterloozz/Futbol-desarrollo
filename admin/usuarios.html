<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios · Acta Digital Arbitral</title>
  <link rel="icon" href="data:,">

  <script src="../comun/sesion.js" data-rol="admin"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
  <!-- [IA] inicio · ia/2026-11-02_cbenavidesp_registro-en-usuarios.md -->
  <link rel="stylesheet" href="../comun/componentes.css">
  <!-- [IA] fin -->

  <script src="../comun/menu.js" defer></script>

  <!-- [IA] inicio · ia/2026-11-02_cbenavidesp_registro-en-usuarios.md · ia/2026-11-04_cbenavidesp_contrasena-arbitros.md · ia/2026-11-09_cbenavidesp_acceso-unico-arbitros.md -->
  <script src="../comun/componentes.js" defer></script>
  <script src="../comun/api.js" defer></script>
  <script src="../comun/seguridad.js" defer></script>
  <script src="registro-arbitros.js" defer></script>
  <!-- [IA] fin -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-800">

  <header id="menu-comun"></header>

  <main class="mx-auto w-full max-w-5xl flex-1 space-y-6 px-4 py-6">
    <h1 class="text-2xl font-semibold">Usuarios</h1>

    <!-- [IA] inicio · ia/2026-11-02_cbenavidesp_vista-registro-arbitros.md · ia/2026-11-02_cbenavidesp_registro-en-usuarios.md · ia/2026-11-04_cbenavidesp_contrasena-arbitros.md · ia/2026-11-09_cbenavidesp_validacion-tiempo-real.md · ia/2026-11-09_cbenavidesp_acceso-unico-arbitros.md -->
    <div x-data="registroArbitros" class="space-y-6">
      <section aria-labelledby="titulo-registro" class="rounded-lg bg-white p-4 shadow-sm">
        <h2 id="titulo-registro" class="mb-4 text-lg font-semibold">Registro de Árbitros</h2>

        <form @submit.prevent="solicitarGuardado()" novalidate class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="arbNombre" class="mb-1 block text-sm font-medium text-slate-700">Nombre completo</label>
            <input type="text" id="arbNombre" placeholder="Ej: Roberto Tobar" x-model="form.nombre"
              @blur="validarCampo('nombre')" @input="revalidar('nombre')"
              :aria-invalid="errores.nombre ? 'true' : 'false'" aria-describedby="arbNombre-error"
              class="w-full rounded-md border px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2"
              :class="errores.nombre ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
            <small id="arbNombre-error" class="mt-1 block text-xs text-red-700" x-show="errores.nombre" x-text="errores.nombre"></small>
          </div>

          <div>
            <label for="arbRut" class="mb-1 block text-sm font-medium text-slate-700">
              RUT <span class="text-xs font-normal text-slate-500">(con guion, ej: 12.345.678-5)</span>
            </label>
            <input type="text" id="arbRut" placeholder="Ej: 12.345.678-5" x-model="form.rut"
              @blur="validarCampo('rut')" @input="revalidar('rut')"
              :aria-invalid="errores.rut ? 'true' : 'false'" aria-describedby="arbRut-error"
              class="w-full rounded-md border px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2"
              :class="errores.rut ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
            <small id="arbRut-error" class="mt-1 block text-xs text-red-700" x-show="errores.rut" x-text="errores.rut"></small>
          </div>

          <div>
            <label for="arbEmail" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
            <input type="email" id="arbEmail" placeholder="Ej: nombre@arbitros.cl" x-model="form.email"
              @blur="validarCampo('email')" @input="revalidar('email')"
              :aria-invalid="errores.email ? 'true' : 'false'" aria-describedby="arbEmail-error"
              class="w-full rounded-md border px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2"
              :class="errores.email ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
            <small id="arbEmail-error" class="mt-1 block text-xs text-red-700" x-show="errores.email" x-text="errores.email"></small>
          </div>

          <div>
            <label for="arbTelefono" class="mb-1 block text-sm font-medium text-slate-700">Teléfono</label>
            <input type="tel" id="arbTelefono" placeholder="Ej: +56 9 1234 5678" x-model="form.telefono"
              @blur="validarCampo('telefono')" @input="revalidar('telefono')"
              :aria-invalid="errores.telefono ? 'true' : 'false'" aria-describedby="arbTelefono-error"
              class="w-full rounded-md border px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2"
              :class="errores.telefono ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
            <small id="arbTelefono-error" class="mt-1 block text-xs text-red-700" x-show="errores.telefono" x-text="errores.telefono"></small>
          </div>

          <div class="sm:col-span-2">
            <label for="arbCategoria" class="mb-1 block text-sm font-medium text-slate-700">Categoría</label>
            <select id="arbCategoria" x-model="form.categoria"
              @blur="validarCampo('categoria')" @change="revalidar('categoria')"
              :aria-invalid="errores.categoria ? 'true' : 'false'" aria-describedby="arbCategoria-error"
              class="w-full rounded-md border bg-white px-3 py-2 focus:outline-none focus:ring-2"
              :class="errores.categoria ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
              <option value="">Selecciona una categoría</option>
              <template x-for="cat in categorias" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>
            <small id="arbCategoria-error" class="mt-1 block text-xs text-red-700" x-show="errores.categoria" x-text="errores.categoria"></small>
          </div>

          <div>
            <label for="arbPassword" class="mb-1 block text-sm font-medium text-slate-700">
              Contraseña <span class="text-xs font-normal text-slate-500">(mínimo 8 caracteres)</span>
            </label>
            <input type="password" id="arbPassword" autocomplete="new-password" x-model="form.password"
              @blur="validarCampo('password')" @input="revalidar('password')"
              :aria-invalid="errores.password ? 'true' : 'false'" aria-describedby="arbPassword-error"
              class="w-full rounded-md border px-3 py-2 focus:outline-none focus:ring-2"
              :class="errores.password ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
            <small id="arbPassword-error" class="mt-1 block text-xs text-red-700" x-show="errores.password" x-text="errores.password"></small>
          </div>

          <div>
            <label for="arbConfirmarPassword" class="mb-1 block text-sm font-medium text-slate-700">Confirmar contraseña</label>
            <input type="password" id="arbConfirmarPassword" autocomplete="new-password" x-model="form.confirmarPassword"
              @blur="validarCampo('confirmarPassword')" @input="revalidar('confirmarPassword')"
              :aria-invalid="errores.confirmarPassword ? 'true' : 'false'" aria-describedby="arbConfirmarPassword-error"
              class="w-full rounded-md border px-3 py-2 focus:outline-none focus:ring-2"
              :class="errores.confirmarPassword ? 'border-red-600 focus:ring-red-600' : 'border-slate-300 focus:ring-blue-600'">
            <small id="arbConfirmarPassword-error" class="mt-1 block text-xs text-red-700" x-show="errores.confirmarPassword" x-text="errores.confirmarPassword"></small>
          </div>

          <div class="flex gap-3 sm:col-span-2">
            <button type="submit" :disabled="guardando" x-text="guardando ? 'Guardando…' : 'Guardar Árbitro'" class="rounded-md bg-blue-700 px-4 py-2 font-medium text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:bg-blue-700">Guardar Árbitro</button>
            <button type="button" @click="reiniciarFormulario()" class="rounded-md bg-slate-200 px-4 py-2 font-medium text-slate-800 hover:bg-slate-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">Limpiar</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="titulo-lista" class="rounded-lg bg-white p-4 shadow-sm">
        <h2 id="titulo-lista" class="mb-3 text-lg font-semibold">Árbitros Registrados</h2>

        <div x-show="estado === 'cargando'" class="space-y-2" role="status" aria-live="polite">
          <span class="sr-only">Cargando árbitros…</span>
          <template x-for="n in 4" :key="n">
            <div class="flex animate-pulse gap-3 rounded-md border border-slate-100 p-3" aria-hidden="true">
              <div class="h-4 w-1/4 rounded bg-slate-200"></div>
              <div class="h-4 w-1/3 rounded bg-slate-100"></div>
              <div class="h-4 w-1/5 rounded bg-slate-200"></div>
            </div>
          </template>
        </div>

        <div x-show="estado === 'error'" x-cloak role="alert"
          class="flex flex-col gap-3 rounded-md border border-red-200 bg-red-50 p-4 text-red-800 sm:flex-row sm:items-center sm:justify-between">
          <p x-text="mensajeError"></p>
          <button type="button" @click="cargar()"
            class="shrink-0 rounded-md bg-red-700 px-4 py-2 font-medium text-white hover:bg-red-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700">Reintentar</button>
        </div>

        <div x-show="estado === 'listo'" x-cloak class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="px-3 py-2 font-semibold">ID</th>
                <th class="px-3 py-2 font-semibold">Nombre</th>
                <th class="px-3 py-2 font-semibold">RUT</th>
                <th class="px-3 py-2 font-semibold">Email</th>
                <th class="px-3 py-2 font-semibold">Teléfono</th>
                <th class="px-3 py-2 font-semibold">Categoría</th>
                <th class="px-3 py-2 font-semibold">Acciones</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <template x-for="arb in arbitros" :key="arb.id">
                <tr>
                  <td class="px-3 py-2" x-text="arb.id"></td>
                  <td class="px-3 py-2" x-text="arb.nombre"></td>
                  <td class="px-3 py-2" x-text="arb.rut"></td>
                  <td class="px-3 py-2" x-text="arb.email"></td>
                  <td class="px-3 py-2" x-text="arb.telefono"></td>
                  <td class="px-3 py-2" x-text="arb.categoria"></td>
                  <td class="px-3 py-2">
                    <button type="button" @click="solicitarEliminacion(arb)" class="rounded font-medium text-red-600 hover:text-red-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700">Eliminar</button>
                  </td>
                </tr>
              </template>
              <tr x-show="arbitros.length === 0">
                <td colspan="7" class="px-3 py-4 text-center text-slate-500">No hay árbitros registrados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
    <!-- [IA] fin -->
  </main>

  <footer x-data class="bg-slate-800 py-4 text-center text-sm text-slate-300">
    <p>Sistema de Acta Digital Arbitral · <span x-text="new Date().getFullYear()"></span></p>
  </footer>

  <!-- [IA] inicio · ia/2026-10-30_cbenavidesp_componentes-alpine.md · ia/2026-11-02_cbenavidesp_registro-en-usuarios.md -->
  <div class="toast-contenedor" x-data="notificaciones" @notificar.window="agregar($event.detail)" aria-live="polite">
    <template x-for="toast in lista" :key="toast.id">
      <div class="toast" :class="'toast--' + toast.tipo" x-show="toast.visible"
        x-transition:leave="toast-salida" x-transition:leave-end="toast-salida-fin" role="status">
        <span x-text="toast.mensaje"></span>
        <button type="button" class="toast-cerrar" @click="cerrar(toast.id)" aria-label="Cerrar">&times;</button>
      </div>
    </template>
  </div>

  <div x-data="modalConfirmacion" @pedir-confirmacion.window="abrir($event.detail)" @keydown.escape.window="abierto && cerrar()">
    <div class="modal-fondo" x-show="abierto" x-cloak x-transition.opacity @click.self="cerrar()">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <h3 id="modal-titulo" class="modal-titulo" x-text="titulo"></h3>
        <p class="modal-mensaje" x-text="mensaje"></p>
        <div class="modal-acciones">
          <button type="button" class="modal-boton modal-boton--secundario" x-ref="botonCancelar" @click="cerrar()">Cancelar</button>
          <button type="button" class="modal-boton" @click="confirmar()" x-text="textoConfirmar"></button>
        </div>
      </div>
    </div>
  </div>
  <!-- [IA] fin -->

</body>
</html>
